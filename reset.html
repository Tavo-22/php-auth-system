<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="card">
    <h2>Nueva contraseña</h2>

    <p style="color:#888; font-size:13px; text-align:center;">
      Ingresa tu nueva contraseña.
    </p>

    <div id="alerta" class="alerta oculto"></div>

    <input type="password" id="password" placeholder="Nueva contraseña (mínimo 8 caracteres)">
    <input type="password" id="confirm"  placeholder="Confirmar contraseña">

    <button id="btn-reset">Restablecer contraseña</button>

    <p class="link"><a href="index.html">← Volver al login</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
