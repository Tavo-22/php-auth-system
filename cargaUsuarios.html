<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargar usuarios</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="card">
    <h2>Cargar usuarios (CSV)</h2>

    <p style="color:#888; font-size:13px; text-align:center;">
      El archivo debe tener las columnas: <strong>nombre, email, password</strong>
    </p>

    <div id="alerta" class="alerta oculto"></div>

    <input type="file" id="archivo-csv" accept=".csv">

    <button id="btn-cargar">Subir y procesar</button>

    <div id="resultado" style="font-size:13px; color:#aaa; white-space:pre-line;"></div>

    <p class="link"><a href="index.html">← Volver al login</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
