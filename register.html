<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="card">
    <h2>Crear cuenta</h2>

    <div id="alerta" class="alerta oculto"></div>

    <input type="text"     id="nombre"   placeholder="Nombre completo">
    <input type="email"    id="email"    placeholder="Correo electrónico">
    <input type="password" id="password" placeholder="Contraseña (mínimo 8 caracteres)">
    <input type="password" id="confirm"  placeholder="Confirmar contraseña">

    <button id="btn-register">Crear cuenta</button>

    <p class="link">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
